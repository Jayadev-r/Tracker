<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f141c" />
    <meta name="description" content="PaisaTrack - Private, offline-first personal expense tracker for iPhone." />
    <meta name="application-name" content="PaisaTrack" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PaisaTrack" />
    <title>PaisaTrack - Expense Tracker</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('paisatrack_theme');
          var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light' || (!saved && !isDark) || (saved === 'system' && !isDark)) {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f8fafc');
          } else if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0f141c');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
